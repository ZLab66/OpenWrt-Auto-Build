# 文件名称：update-checker.yml
# 文件用途：定时检查 OpenWrt 官方稳定版更新，并触发固件自动编译与发布
#
# 原项目版权 (c) 2019-2024 P3TERX <https://p3terx.com>
# 本项目基于 MIT 许可证开源
# 许可证详情请查看仓库根目录下的 LICENSE 文件
#
# 文件用途：检查 OpenWrt 最新正式稳定版，并检测对应维护分支的最新提交
#

name: Update Checker

on:
  # 每天北京时间凌晨 2 点检查
  schedule:
    - cron: '0 18 * * *'

  # 支持手动指定官方稳定版 Tag
  workflow_dispatch:
    inputs:
      tag:
        description: '指定 OpenWrt Tag，例如 v25.12.6，留空使用最新稳定版'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      # 获取官方稳定版、对应维护分支和最新 Commit
      - name: 获取 OpenWrt 最新稳定分支
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: https://github.com/openwrt/openwrt
        run: |
          # 手动指定版本时使用指定 Tag
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          else
            # 获取官方最新正式稳定版
            RESPONSE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/openwrt/openwrt/releases/latest)

            TAG=$(echo "$RESPONSE" | jq -er '.tag_name')
          fi

          # 只接受正式稳定版版本号
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误：无效的正式版本 Tag：$TAG"
            exit 1
          fi

          # 验证官方 Release 确实存在
          STATUS=$(curl -sS -o /tmp/openwrt-release.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/openwrt/openwrt/releases/tags/$TAG")

          if [ "$STATUS" != "200" ]; then
            echo "错误：OpenWrt 官方不存在该正式版本：$TAG"
            cat /tmp/openwrt-release.json
            exit 1
          fi

          # 从正式版本号提取维护分支版本
          VERSION="${TAG#v}"
          SERIES="${VERSION%.*}"
          BRANCH="openwrt-$SERIES"

          echo "官方稳定版：$TAG"
          echo "对应维护分支：$BRANCH"

          # 获取维护分支最新 Commit
          COMMIT=$(git ls-remote "$REPO_URL" "refs/heads/$BRANCH" | awk '{print $1}')

          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "错误：官方维护分支不存在或无法获取：$BRANCH"
            exit 1
          fi

          # 使用分支名和 Commit 短哈希生成唯一发布 Tag
          SHORT_COMMIT="${COMMIT:0:12}"
          RELEASE_TAG="${BRANCH}-${SHORT_COMMIT}"

          echo "最新 Commit：$COMMIT"
          echo "本次发布标记：$RELEASE_TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # 检查这个 Commit 是否已经成功发布
      - name: 检查固件发布状态
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          STATUS=$(curl -sS -o /tmp/release.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")

          if [ "$STATUS" = "200" ]; then
            HAS_FIRMWARE=$(jq -r \
              'any(.assets[]?; .name | endswith("combined-efi.img.gz"))' \
              /tmp/release.json)

            if [ "$HAS_FIRMWARE" = "true" ]; then
              echo "该 Commit 已经成功发布固件，跳过：$RELEASE_TAG"
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "该 Commit 尚未成功发布固件，允许重新编译：$RELEASE_TAG"
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi

          elif [ "$STATUS" = "404" ]; then
            echo "发现新的 Commit，需要编译：$RELEASE_TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"

          else
            echo "错误：GitHub API 请求失败，HTTP 状态码：$STATUS"
            cat /tmp/release.json
            exit 1
          fi

      # 触发固件编译
      - name: 触发 OpenWrt 编译
        if: steps.published.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          BRANCH: ${{ steps.source.outputs.branch }}
          COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg release_tag "$RELEASE_TAG" \
            '{
              event_type:"openwrt_release",
              client_payload:{
                tag:$tag,
                branch:$branch,
                commit:$commit,
                release_tag:$release_tag
              }
            }')

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -d "$PAYLOAD"

          echo "已发送编译请求：$RELEASE_TAG"
